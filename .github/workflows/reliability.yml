name: Full-suite reliability
on:
  workflow_dispatch:
  push:
    branches: [keytrail/release-correctness]
    paths: [.github/workflows/reliability.yml]
permissions:
  contents: read
concurrency:
  group: keytrail-reliability-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reliability:
    name: 100 sequential rounds and worker isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --init --ipc=host
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Install pinned pnpm for the container user
        run: |
          npm install -g --prefix "$RUNNER_TEMP/keytrail-pnpm" pnpm@11.25.0
          echo "$RUNNER_TEMP/keytrail-pnpm/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build and check the frozen source
        run: |
          pnpm build
          pnpm test:types
          pnpm test:unit
      - name: Run 100 full rounds without retries
        timeout-minutes: 340
        shell: bash
        run: |
          set -o pipefail
          pnpm verify:reliability 2>&1 | tee artifacts/reliability-console.log
      - name: Retain raw rounds and final proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reliability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/reliability/
            artifacts/reliability-verification.json
            artifacts/reliability-console.log
          compression-level: 9
          retention-days: 14
          if-no-files-found: error
