name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Linux / Chromium / package consumers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --init --ipc=host
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Install pinned pnpm for the container user
        run: |
          npm install -g --prefix "$RUNNER_TEMP/keytrail-pnpm" pnpm@11.25.0
          echo "$RUNNER_TEMP/keytrail-pnpm/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir examples/react-portal install --frozen-lockfile --ignore-scripts
      - name: Record runner environment
        run: |
          mkdir -p artifacts
          node --input-type=module <<'JS'
          import { cpus, platform, arch, release, totalmem } from 'node:os';
          import { writeFileSync } from 'node:fs';
          writeFileSync('artifacts/runner-environment.json', JSON.stringify({
            platform: platform(), arch: arch(), release: release(), node: process.versions.node,
            cpu: cpus()[0]?.model, logicalCpus: cpus().length, memoryBytes: totalmem(),
            imageOS: process.env.ImageOS, imageVersion: process.env.ImageVersion,
          }, null, 2) + '\n');
          JS
      - name: Build and check contracts
        run: |
          pnpm build
          pnpm test:types
          pnpm test:unit
          node --test scripts/tests/*.test.mjs
          pnpm test:guard
      - name: Browser regression suite (one worker)
        env:
          KEYTRAIL_PROFILE_SNAPSHOTS: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: artifacts/browser-results.json
        run: |
          status=0
          pnpm exec playwright test --workers=1 --retries=0 --reporter=list,json || status=$?
          node scripts/summarize-observations.mjs artifacts/browser-results.json > artifacts/browser-observations.json
          exit "$status"
      - name: Verify development tarball consumers
        run: pnpm test:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-evidence
          path: |
            artifacts/*.json
            artifacts/*.tgz
            artifacts/SHA256SUMS
            artifacts/consumers/react-portal/
          if-no-files-found: error
  macos:
    name: macOS 15 ARM / allocation ${{ matrix.round }} / package consumers
    runs-on: macos-15
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        round: [1, 2, 3]
    env:
      KEYTRAIL_ALLOCATION: ${{ matrix.round }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir examples/react-portal install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install chromium
      - name: Record runner environment
        run: |
          mkdir -p artifacts
          node --input-type=module <<'JS'
          import { cpus, platform, arch, release, totalmem } from 'node:os';
          import { writeFileSync } from 'node:fs';
          writeFileSync('artifacts/runner-environment.json', JSON.stringify({
            allocation: Number(process.env.KEYTRAIL_ALLOCATION), runnerLabel: 'macos-15',
            runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            runnerEnvironment: process.env.RUNNER_ENVIRONMENT,
            platform: platform(), arch: arch(), release: release(), node: process.versions.node,
            cpu: cpus()[0]?.model, logicalCpus: cpus().length, memoryBytes: totalmem(),
            imageOS: process.env.ImageOS, imageVersion: process.env.ImageVersion,
          }, null, 2) + '\n');
          JS
      - name: Build and check contracts
        run: |
          pnpm build
          pnpm test:types
          pnpm test:unit
          node --test scripts/tests/*.test.mjs
          pnpm test:guard
      - name: Browser regression suite (one round per fresh allocation)
        env:
          KEYTRAIL_PROFILE_SNAPSHOTS: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: artifacts/browser-results.json
        run: |
          keytrail_browser_exit=0
          pnpm exec playwright test --workers=1 --retries=0 --reporter=list,json || keytrail_browser_exit=$?
          cp artifacts/browser-results.json "artifacts/browser-round-${KEYTRAIL_ALLOCATION}.json"
          node scripts/summarize-observations.mjs artifacts/browser-results.json > "artifacts/browser-observations-${KEYTRAIL_ALLOCATION}.json"
          exit "$keytrail_browser_exit"
      - name: Verify development tarball consumers
        run: pnpm test:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-15-arm-round-${{ matrix.round }}-evidence
          path: |
            artifacts/*.json
            artifacts/*.tgz
            artifacts/SHA256SUMS
            artifacts/consumers/react-portal/
          if-no-files-found: error
